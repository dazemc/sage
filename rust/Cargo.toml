[package]
name = "sage"
version = "0.2.0"
edition = "2021"
description = "Tier ladder for every model on the machine — price and benchmark ranked, router-ready"

[[bin]]
name = "sage"
path = "src/main.rs"

[dependencies]
crossterm = "0.29.0"
ratatui = "0.30.2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
